<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog — Jayesh Vinod Patil</title>
    <meta
      name="description"
      content="Jayesh Vinod Patil — blog posts on programming and thoughts."
    />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <button
      id="theme-toggle"
      title="Toggle dark/light mode"
      aria-label="Toggle theme"
    >
      <svg
        class="sun-icon"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2" />
        <path d="M12 20v2" />
        <path d="M4.93 4.93l1.41 1.41" />
        <path d="M17.66 17.66l1.41 1.41" />
        <path d="M2 12h2" />
        <path d="M20 12h2" />
        <path d="M6.34 17.66l-1.41 1.41" />
        <path d="M19.07 4.93l-1.41 1.41" />
      </svg>
      <svg
        class="moon-icon"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    </button>

    <div class="container">
      <div
        class="resizer-handle"
        title="Drag to resize page width"
        aria-label="Resize page width"
        role="separator"
      ></div>

      <p class="back"><a href="../index.html">← home</a></p>

      <header>
        <h1>Blog</h1>
        <p class="tagline">thoughts, guides, and programming notes</p>
      </header>

      <hr />

      <section id="blog-posts">
        <ul class="blog-list">
          <li>
            <a href="hello-world.html">hello_world</a>
            <span class="blog-date">— july 2026</span>
          </li>
          <li>
            <a href="even-odd.html"
              >most fundamental way to check even/odd</a
            >
            <span class="blog-date">— july 2026</span>
          </li>
        </ul>
      </section>
    </div>

    <script>
      (function () {
        const container = document.querySelector(".container");

        const btn = document.getElementById("theme-toggle");
        let stored;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {
          // Ignore localStorage errors in private browsing/iframe sandboxing
        }
        if (stored === "dark") {
          document.documentElement.classList.add("dark");
          document.body.classList.add("dark");
        }
        btn.addEventListener("click", function () {
          document.documentElement.classList.toggle("dark");
          document.body.classList.toggle("dark");
          const isDark = document.body.classList.contains("dark");
          try {
            localStorage.setItem("theme", isDark ? "dark" : "light");
          } catch (e) {
            // Ignore localStorage errors in private browsing/iframe sandboxing
          }
        });

        // Container Resizer Logic
        const resizer = container.querySelector(".resizer-handle");
        if (resizer) {
          let isDragging = false;

          function onStart(e) {
            if (isDragging) return;
            e.preventDefault();
            isDragging = true;
            resizer.classList.add("dragging");
            document.body.classList.add("dragging-width");

            window.addEventListener("mousemove", onMove, { passive: false });
            window.addEventListener("mouseup", onEnd);
            window.addEventListener("touchmove", onMove, { passive: false });
            window.addEventListener("touchend", onEnd);
            window.addEventListener("touchcancel", onEnd);
          }

          function onMove(e) {
            if (!isDragging) return;
            let clientX;
            if (e.touches && e.touches.length > 0) {
              clientX = e.touches[0].clientX;
            } else {
              clientX = e.clientX;
            }

            const rect = container.getBoundingClientRect();
            const center = rect.left + rect.width / 2;
            let newWidth = Math.abs(clientX - center) * 2;

            const minWidth = Math.min(320, window.innerWidth * 0.9);
            const maxWidthLimit = window.innerWidth * 0.95;

            if (newWidth < minWidth) newWidth = minWidth;
            if (newWidth > maxWidthLimit) newWidth = maxWidthLimit;

            const widthStr = `${newWidth}px`;
            container.style.maxWidth = widthStr;
          }

          function onEnd() {
            if (!isDragging) return;
            isDragging = false;
            resizer.classList.remove("dragging");
            document.body.classList.remove("dragging-width");

            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onEnd);
            window.removeEventListener("touchmove", onMove);
            window.removeEventListener("touchend", onEnd);
            window.removeEventListener("touchcancel", onEnd);
          }

          resizer.addEventListener("mousedown", onStart);
          resizer.addEventListener("touchstart", onStart, { passive: false });
        }

        // ── Live Visitor Counter (Today & Total Lifetime) ──
        function runVisitorCounter() {
          const todayEl = document.getElementById("visitor-count-today");
          const totalEl = document.getElementById("visitor-count-total");
          const legacyEl = document.getElementById("visitor-count");
          if (!todayEl && !totalEl && !legacyEl) return;

          const now = new Date();
          const yyyy = now.getUTCFullYear();
          const mm = String(now.getUTCMonth() + 1).padStart(2, "0");
          const dd = String(now.getUTCDate()).padStart(2, "0");
          const todayDateStr = `${yyyy}-${mm}-${dd}`;

          const API_TOTAL_GET = "https://api.counterapi.dev/v1/jvp008-portfolio/visits/";
          const API_TOTAL_UP = "https://api.counterapi.dev/v1/jvp008-portfolio/visits/up";
          const API_TODAY_GET = `https://api.counterapi.dev/v1/jvp008-portfolio/daily-visits-${todayDateStr}/`;
          const API_TODAY_UP = `https://api.counterapi.dev/v1/jvp008-portfolio/daily-visits-${todayDateStr}/up`;

          let cachedToday = null;
          let cachedTotal = null;

          try {
            const cachedDate = localStorage.getItem("cached_visitor_date");
            const cachedTodayRaw = localStorage.getItem("cached_visitor_count_today");
            const cachedTotalRaw = localStorage.getItem("cached_visitor_count_total");

            if (cachedTotalRaw && !isNaN(parseInt(cachedTotalRaw, 10))) {
              cachedTotal = parseInt(cachedTotalRaw, 10);
            }
            if (cachedDate === todayDateStr && cachedTodayRaw && !isNaN(parseInt(cachedTodayRaw, 10))) {
              cachedToday = parseInt(cachedTodayRaw, 10);
            }
          } catch (e) {}

          if (todayEl && cachedToday !== null) todayEl.textContent = cachedToday.toLocaleString();
          if (totalEl && cachedTotal !== null) totalEl.textContent = cachedTotal.toLocaleString();
          if (legacyEl && cachedTotal !== null) legacyEl.textContent = cachedTotal.toLocaleString();

          async function updateVisitorCounts() {
            let hasVisitedSession = false;
            try {
              hasVisitedSession = sessionStorage.getItem("portfolio_visited") === "true";
            } catch (e) {}

            const totalTarget = hasVisitedSession ? API_TOTAL_GET : API_TOTAL_UP;
            const todayTarget = hasVisitedSession ? API_TODAY_GET : API_TODAY_UP;

            try {
              const [resTotal, resToday] = await Promise.all([
                fetch(totalTarget).catch(() => null),
                fetch(todayTarget).catch(() => null)
              ]);

              if (resTotal && resTotal.ok) {
                const dataTotal = await resTotal.json();
                if (dataTotal && typeof dataTotal.count === "number" && dataTotal.count > 0) {
                  cachedTotal = dataTotal.count;
                  if (totalEl) totalEl.textContent = cachedTotal.toLocaleString();
                  if (legacyEl) legacyEl.textContent = cachedTotal.toLocaleString();
                  try { localStorage.setItem("cached_visitor_count_total", cachedTotal.toString()); } catch (e) {}
                }
              }

              if (resToday && resToday.ok) {
                const dataToday = await resToday.json();
                if (dataToday && typeof dataToday.count === "number" && dataToday.count > 0) {
                  cachedToday = dataToday.count;
                  if (todayEl) todayEl.textContent = cachedToday.toLocaleString();
                  try {
                    localStorage.setItem("cached_visitor_date", todayDateStr);
                    localStorage.setItem("cached_visitor_count_today", cachedToday.toString());
                  } catch (e) {}
                }
              }

              try {
                sessionStorage.setItem("portfolio_visited", "true");
              } catch (e) {}
            } catch (err) {
              console.warn("Visitor counter fetch error:", err);
            }

            if (todayEl && (todayEl.textContent === "..." || todayEl.textContent === "")) {
              todayEl.textContent = (cachedToday !== null ? cachedToday : 1).toLocaleString();
            }
            if (totalEl && (totalEl.textContent === "..." || totalEl.textContent === "")) {
              totalEl.textContent = (cachedTotal !== null ? cachedTotal : 1).toLocaleString();
            }
            if (legacyEl && (legacyEl.textContent === "..." || legacyEl.textContent === "")) {
              legacyEl.textContent = (cachedTotal !== null ? cachedTotal : 1).toLocaleString();
            }
          }

          updateVisitorCounts();

          setInterval(async () => {
            try {
              const [resTotal, resToday] = await Promise.all([
                fetch(API_TOTAL_GET).catch(() => null),
                fetch(API_TODAY_GET).catch(() => null)
              ]);
              if (resTotal && resTotal.ok) {
                const d = await resTotal.json();
                if (d && typeof d.count === "number" && d.count > 0) {
                  if (totalEl) totalEl.textContent = d.count.toLocaleString();
                  if (legacyEl) legacyEl.textContent = d.count.toLocaleString();
                  try { localStorage.setItem("cached_visitor_count_total", d.count.toString()); } catch (e) {}
                }
              }
              if (resToday && resToday.ok) {
                const d = await resToday.json();
                if (d && typeof d.count === "number" && d.count > 0) {
                  if (todayEl) todayEl.textContent = d.count.toLocaleString();
                  try {
                    localStorage.setItem("cached_visitor_date", todayDateStr);
                    localStorage.setItem("cached_visitor_count_today", d.count.toString());
                  } catch (e) {}
                }
              }
            } catch (e) {}
          }, 30000);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", runVisitorCounter);
        } else {
          runVisitorCounter();
        }
      })();
    </script>

    <!-- Live Visitor Counter (Bottom Left Corner) -->
    <div id="live-visitor-counter" class="live-visitor-counter" aria-live="polite" title="Live Portfolio Visitors (Today & Lifetime)">
      <span class="visitor-pulse-dot" aria-hidden="true"></span>
      <svg class="visitor-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <span class="visitor-stat"><span id="visitor-count-today" class="visitor-count">...</span> today</span>
      <span class="visitor-divider">·</span>
      <span class="visitor-stat"><span id="visitor-count-total" class="visitor-count">...</span> total</span>
    </div>
  </body>
</html>
